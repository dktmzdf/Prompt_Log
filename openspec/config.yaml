schema: spec-driven

context: |
  Language: Korean
  All artifacts must be written in Korean.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - tasks.md의 `## N` 그룹을 한 번에 하나만 구현한다. 그 그룹의 체크박스를
        모두 마치면 멈추고 결과를 보고한다.
      - 다음 그룹은 사용자가 지시할 때까지 시작하지 않는다. 한 번의 apply 실행에서
        두 개 이상의 그룹을 연속으로 처리하지 않는다.
      - 사용자가 특정 그룹을 지정하면 그 그룹만 구현한다. 지정하지 않으면 남은 것 중
        가장 앞선 그룹을 구현한다.
      - 구현 중 발견한 문제가 다음 4가지 중 하나일 때만 멈추고 보고한다. 성능에 지대한
        문제, 강력한 결합 구조, 테스트가 불가능한 구조, 3개 이상의 하드코딩.
      - 그 밖의 문제는 멈추지 않는다. 해당 체인지 design.md의 `## 보류된 개선` 절에 한
        항목으로 기록하고 작업을 계속한다. 그룹 완료 보고 때 새로 기록한 항목을 한 줄씩
        알린다.
      - 보류된 개선은 모든 태스크가 끝난 뒤 모아서 한 번에 고친다.
